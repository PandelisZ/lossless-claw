[databases]
postgres = host=__POSTGRES_CONTAINER__ port=5432 dbname=postgres
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 30
default_pool_size = 2
max_prepared_statements = 0
server_reset_query_always = 1
server_reset_query = DISCARD ALL
admin_users = postgres
